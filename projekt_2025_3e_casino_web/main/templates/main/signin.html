<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Casino Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #ff5252, #ff8c00);
        }
    </style>
</head>
<body>
    {% load socialaccount %}

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body p-5">
                        <h1 class="card-title text-center mb-4">Casino Web</h1>

                        {% if user.is_authenticated %}
                            <div class="alert alert-success" role="alert">
                                Již jsi přihlášen jako {{ user.username }}
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="{% url 'home' %}" class="btn btn-primary">Jít na home</a>
                                <a href="{% url 'account_logout' %}" class="btn btn-secondary">Odhlásit se</a>
                            </div>
                        {% else %}
                            <h2 class="text-center mb-4">Přihlášení</h2>
                            <form method="post" action="{% url 'account_login' %}">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="login" class="form-label">Email</label>
                                    <input type="email" name="login" class="form-control" id="login" placeholder="Zadejte email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Heslo</label>
                                    <input type="password" name="password" class="form-control" id="password" placeholder="Zadejte heslo" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg">Přihlásit se</button>
                                </div>
                            </form>
                            <p class="text-center mt-3">
                                <a href="{% url 'account_signup' %}">Nemáte účet? Registrujte se</a>
                            </p>
                            <p class="text-center">
                                <a href="{% url 'account_reset_password' %}">Zapomněli jste heslo?</a>
                            </p>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
