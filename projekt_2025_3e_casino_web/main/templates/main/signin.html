<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Casino Web</title>
</head>
<body>
    {% load socialaccount %}
    
    <h1>Casino Web</h1>
    
    <div>
        <h2>Sign In</h2>
        
        {% if user.is_authenticated %}
            <p>Již jsi přihlášen jako {{ user.username }}</p>
            <a href="{% url 'home' %}">Jít na home</a> | <a href="{% url 'account_logout' %}">Odhlásit se</a>
        {% else %}
            <form method="post" action="{% url 'account_login' %}">
                {% csrf_token %}
                <input type="email" name="login" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            
            <p><a href="{% url 'account_signup' %}">Registrace</a></p>
        {% endif %}
    </div>
</body>
</html>
