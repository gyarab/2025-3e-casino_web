<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obchod - Casino Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f2f6fa;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .navbar {
            background: linear-gradient(270deg, #ff6b6b, #ffa500, #ff6b6b);
            background-size: 600% 600%;
            animation: gradientMove 6s linear infinite;
            color: #fff !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        @keyframes gradientMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        .navbar .navbar-brand, .navbar .nav-link, .navbar .navbar-text {
            color: #fff !important;
        }
        .profile-box {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
            padding: 40px;
            margin: 40px auto;
            max-width: 900px;
            font-size: 1.2em;
            transition: box-shadow 0.3s;
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUp 1s forwards;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .btn-play {
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
            margin-top: 18px;
            background: linear-gradient(270deg, #ff6b6b, #ffa500, #ff6b6b);
            background-size: 600% 600%;
            animation: gradientMove 3s linear infinite;
            transition: transform 0.2s;
        }
        .btn-play:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Casino Web</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Domů</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'gamemodes' %}">Herní módy</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'shop' %}">Obchod</a>
                    </li>
                </ul>
                <div class="d-flex">
                    {% if user.is_authenticated %}
                        <div class="dropdown">
                            <button class="btn btn-outline-light dropdown-toggle" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                {{ user.username }}
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="profileDropdown">
                                <li><h6 class="dropdown-header">Váš profil</h6></li>
                                <li><span class="dropdown-item-text">Zůstatek: ${{ user.userprofile.balance }}</span></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="{% url 'account_logout' %}">Odhlásit se</a></li>
                            </ul>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="profile-box">
        <h2>Obchod</h2>
        <p>Váš aktuální zůstatek je: <strong>${{ user.userprofile.balance }}</strong></p>
        <hr>
        <h4>Koupit kredity</h4>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" name="amount" value="10" class="btn btn-play">Koupit 10</button>
            <button type="submit" name="amount" value="100" class="btn btn-play">Koupit 100</button>
            <button type="submit" name="amount" value="1000" class="btn btn-play">Koupit 1000</button>
        </form>
        <br>
        <a href="{% url 'home' %}" class="btn btn-secondary">Zpět domů</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
