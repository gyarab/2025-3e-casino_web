{% extends 'main/base.html' %}

{% block title %}Shop - Casino Web{% endblock %}

{% block extra_head %}
    <style>
        .profile-box {
            background: linear-gradient(135deg, #2d1810 0%, #1a1a1a 100%);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.50);
            padding: 40px;
            margin: 40px auto;
            max-width: 900px;
            font-size: 1.2em;
            transition: box-shadow 0.3s;
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUp 1s forwards;
            border: 3px solid #ffd700;
            color: #f4e4bc;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .profile-box h2, .profile-box h4 {
            color: #f4e4bc;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        .profile-box p {
            color: #f4e4bc;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .btn-play {
            color: #f4e4bc;
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.30);
            margin-top: 18px;
            background: linear-gradient(270deg, #daa520, #ffd700, #daa520);
            background-size: 600% 600%;
            animation: gradientMove 3s linear infinite;
            transition: transform 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        .btn-play:hover {
            transform: scale(1.08);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #8b0000, #b22222);
            color: #f4e4bc;
            border: 2px solid #ffd700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, #b22222, #8b0000);
        }
        @keyframes gradientMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
    </style>
{% endblock %}

{% block content %}
    <div class="container pt-4">
        <div class="profile-box">
            <h2>Shop</h2>
            <p>Your current balance is: <strong>${{ user.userprofile.balance }}</strong></p>
            <hr style="border-color: #ffd700;">
            <h4>Buy Credits</h4>
            <form method="post" class="mt-3">
                {% csrf_token %}
                <button type="submit" name="amount" value="10" class="btn btn-play">Buy 10</button>
                <button type="submit" name="amount" value="100" class="btn btn-play">Buy 100</button>
                <button type="submit" name="amount" value="1000" class="btn btn-play">Buy 1000</button>
            </form>
            <br>
            <a href="{% url 'home' %}" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
{% endblock %}
