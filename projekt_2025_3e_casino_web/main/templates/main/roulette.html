{% extends 'main/base.html' %}
{% load static %}

{% block title %}Roulette - Casino Web{% endblock %}

{% block extra_head %}
<style>
    body {
        background: #030109;
    }

    .roulette-page {
        display: flex;
        justify-content: center;
        padding: 14px 8px 38px;
    }

    .roulette-shell {
        position: relative;
        width: min(100%, 1254px);
        aspect-ratio: 1 / 1;
        background-image: url("{% static 'main/roulette-template.jpg' %}");
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        filter: drop-shadow(0 22px 45px rgba(0, 0, 0, 0.62));
        overflow: hidden;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
    }

    .balance-value,
    .bet-value,
    .result-value {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff7ff;
        font-weight: 900;
        line-height: 1;
        text-align: center;
        pointer-events: none;
        text-shadow: 0 0 10px #f4dcff, 0 0 24px rgba(190, 88, 255, 0.85), 0 4px 2px rgba(0, 0, 0, 0.75);
        z-index: 5;
    }

    .balance-value {
    left: 3.1%;
    top: 8.05%;
    width: 27.2%;
    height: 6%;
    font-size: clamp(1.25rem, 3.35vw, 2.95rem);
}

.bet-value {
    left: 52.7%;
    top: 12.45%;
    width: 44%;
    height: 6.1%;
    font-size: clamp(1.25rem, 3.35vw, 2.95rem);
}

    .result-value {
        left: 52.7%;
        top: 31.1%;
        width: 44%;
        height: 12%;
        color: #ffffff;
        font-size: clamp(1.1rem, 3.7vw, 3.2rem);
        text-transform: uppercase;
        opacity: 0;
        transform: scale(0.82);
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .result-value.show {
        opacity: 1;
        transform: scale(1);
    }

    .result-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.8em;
        min-height: 1.8em;
        margin-right: 0.28em;
        border-radius: 50%;
        border: 2px solid rgba(255, 230, 150, 0.95);
        box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.18), 0 0 18px rgba(255, 214, 64, 0.35);
    }

    .result-number.red {
        background: linear-gradient(180deg, #de1717, #6f0303);
    }

    .result-number.black {
        background: linear-gradient(180deg, #1b1b22, #030307);
    }

    .result-number.green {
        background: linear-gradient(180deg, #07891c, #023b0d);
    }

    .wheel-ball-orbit {
        position: absolute;
        left: 28.75%;
        top: 35.85%;
        width: 0;
        height: 0;
        z-index: 7;
        transform: rotate(var(--ball-angle, -90deg));
        transition: transform 2.8s cubic-bezier(0.15, 0.68, 0.22, 1);
        pointer-events: none;
    }

    .wheel-ball {
        position: absolute;
        left: 0;
        top: 0;
        width: clamp(8px, 1.25vw, 16px);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, #ffffff 0%, #ffffff 28%, #d8d8d8 58%, #747474 100%);
        box-shadow: 0 0 9px rgba(255, 255, 255, 0.98), 0 0 18px rgba(255, 255, 255, 0.48), 0 6px 7px rgba(0, 0, 0, 0.58);
        transform: translate(-50%, -50%) translateX(clamp(80px, 19.25vw, 242px));
    }

    .wheel-ball-orbit.spinning {
        transition: transform 3.05s cubic-bezier(0.12, 0.68, 0.17, 1);
    }

    .hotspot,
    .chip-hotspot,
    .control-hotspot {
        position: absolute;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
        z-index: 10;
    }

    .hotspot:focus-visible,
    .chip-hotspot:focus-visible,
    .control-hotspot:focus-visible {
        outline: 3px solid rgba(255, 226, 88, 0.95);
        outline-offset: -3px;
    }

    .hotspot:hover {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 0 14px rgba(255, 216, 95, 0.36);
    }

    .chip-hotspot {
        border-radius: 50%;
    }

    .chip-hotspot.active {
        box-shadow: 0 0 0 3px rgba(255, 232, 105, 0.95), 0 0 19px rgba(255, 210, 49, 0.88);
    }

    .control-hotspot.clear:hover,
    .control-hotspot.repeat:hover {
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 16px rgba(227, 75, 255, 0.28), 0 0 16px rgba(227, 75, 255, 0.38);
    }

    .control-hotspot.spin {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        color: #fff6c7;
        font-size: clamp(1rem, 2.7vw, 2.45rem);
        font-weight: 900;
        text-shadow: 0 0 9px rgba(255, 244, 179, 0.95), 0 4px 2px rgba(0, 0, 0, 0.65);
    }

    .control-hotspot.spin:hover {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 0 18px rgba(255, 230, 84, 0.3), 0 0 22px rgba(81, 255, 66, 0.46);
    }

    .control-hotspot.spin:disabled {
        cursor: wait;
        opacity: 0.72;
    }

    .bet-chip {
        position: absolute;
        width: 3.5%;
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        color: #ffffff;
        font-size: clamp(0.36rem, 0.95vw, 0.84rem);
        font-weight: 900;
        line-height: 1;
        text-shadow: 0 1px 2px #000, 0 0 4px #000;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 12;
    }

    .message-bar {
        position: absolute;
        left: 52.7%;
        top: 45.7%;
        width: 44%;
        height: 5.2%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff6c7;
        font-size: clamp(0.74rem, 1.75vw, 1.45rem);
        font-weight: 800;
        text-align: center;
        text-shadow: 0 0 9px rgba(255, 214, 64, 0.8), 0 3px 2px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        z-index: 6;
    }

    @media (max-width: 640px) {
        .roulette-page {
            padding: 6px 0 26px;
        }

        .control-hotspot.spin {
            border-radius: 8px;
        }

        .bet-chip {
            width: 4.4%;
            font-size: clamp(0.28rem, 1.35vw, 0.55rem);
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="roulette-page">
    <div class="roulette-shell" id="rouletteTable">
        <h1 class="sr-only">Roulette</h1>

        <div class="balance-value">$<span id="balance">{{ balance }}</span></div>
        <div class="bet-value">$<span id="totalBet">0</span></div>
        <div class="message-bar" id="messageBar">Vyberte chip a polozte sazku.</div>
        <div class="result-value" id="resultValue"></div>

        <div class="wheel-ball-orbit" id="ballOrbit">
            <div class="wheel-ball"></div>
        </div>

        <div id="chipHotspots"></div>
        <div id="betHotspots"></div>
        <div id="placedChips"></div>

        <button class="control-hotspot clear" id="clearBtn" type="button" aria-label="Vymazat sazky"
                style="left:35.85%;top:89.75%;width:14.15%;height:6.8%;"></button>
        <button class="control-hotspot repeat" id="repeatBtn" type="button" aria-label="Zopakovat posledni sazku"
                style="left:51.65%;top:89.75%;width:15.25%;height:6.8%;"></button>
        <button class="control-hotspot spin" id="spinBtn" type="button" aria-label="Roztocit ruletu"
                style="left:69.25%;top:89.6%;width:27.75%;height:6.95%;">SPIN</button>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const CSRF_TOKEN = '{{ csrf_token }}';

    const chipImages = {
        10: "{% static 'main/roulette-chip-10.png' %}",
        50: "{% static 'main/roulette-chip-50.png' %}",
        100: "{% static 'main/roulette-chip-100.png' %}",
        500: "{% static 'main/roulette-chip-500.png' %}",
        1000: "{% static 'main/roulette-chip-1000.png' %}"
    };

    const redNumbers = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
    const wheelOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28];

    const bets = new Map();
    let selectedChip = 10;
    let lastBets = [];
    let ballAngle = -90;
    let spinning = false;

    const chipHotspots = document.getElementById('chipHotspots');
    const betHotspots = document.getElementById('betHotspots');
    const placedChips = document.getElementById('placedChips');
    const totalBet = document.getElementById('totalBet');
    const balance = document.getElementById('balance');
    const messageBar = document.getElementById('messageBar');
    const resultValue = document.getElementById('resultValue');
    const ballOrbit = document.getElementById('ballOrbit');
    const spinBtn = document.getElementById('spinBtn');

    function formatMoney(value) {
        return Number(value).toLocaleString('en-US', { maximumFractionDigits: 2 });
    }

    function betKey(bet) {
        return `${bet.type}:${bet.value}`;
    }

    function makeButton(parent, className, box, label, onClick) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = className;
        button.setAttribute('aria-label', label);
        button.style.left = `${box.left}%`;
        button.style.top = `${box.top}%`;
        button.style.width = `${box.width}%`;
        button.style.height = `${box.height}%`;
        button.addEventListener('click', onClick);
        parent.appendChild(button);
        return button;
    }

    function setupChipButtons() {
        const chips = [
            { amount: 10, left: 54.55 },
            { amount: 50, left: 63.0 },
            { amount: 100, left: 71.45 },
            { amount: 500, left: 79.9 },
            { amount: 1000, left: 88.35 }
        ];

        chips.forEach(chip => {
            const button = makeButton(
                chipHotspots,
                'chip-hotspot',
                { left: chip.left, top: 19.95, width: 7.2, height: 7.2 },
                `Vybrat chip ${chip.amount}`,
                () => {
                    selectedChip = chip.amount;
                    document.querySelectorAll('.chip-hotspot').forEach(item => item.classList.remove('active'));
                    button.classList.add('active');
                    messageBar.textContent = `Vybrany chip: $${chip.amount}`;
                }
            );

            if (chip.amount === selectedChip) {
                button.classList.add('active');
            }
        });
    }

    function addBet(bet) {
        const key = betKey(bet);
        const current = bets.get(key);

        if (current) {
            current.amount += selectedChip;
            current.lastChip = selectedChip;
        } else {
            bets.set(key, { ...bet, amount: selectedChip, lastChip: selectedChip });
        }

        resultValue.classList.remove('show');
        messageBar.textContent = `Polozeno $${selectedChip}`;
        renderBets();
    }

    function renderBets() {
        placedChips.innerHTML = '';
        let total = 0;

        bets.forEach(bet => {
            total += bet.amount;
            const chip = document.createElement('div');
            chip.className = 'bet-chip';
            chip.style.left = `${bet.center.left}%`;
            chip.style.top = `${bet.center.top}%`;
            chip.style.backgroundImage = `url("${chipImages[bet.lastChip] || chipImages[10]}")`;
            chip.textContent = bet.amount >= 1000 ? `${Math.round(bet.amount / 1000)}K` : bet.amount;
            placedChips.appendChild(chip);
        });

        totalBet.textContent = formatMoney(total);
    }

    function clearBets(saveLast = true) {
        if (saveLast && bets.size > 0) {
            lastBets = Array.from(bets.values()).map(bet => ({ ...bet }));
        }

        bets.clear();
        renderBets();
        messageBar.textContent = 'Sazky vymazany.';
    }

    function repeatBets() {
        if (!lastBets.length) {
            messageBar.textContent = 'Zatim neni co zopakovat.';
            return;
        }

        bets.clear();

        lastBets.forEach(bet => {
            bets.set(betKey(bet), { ...bet });
        });

        renderBets();
        messageBar.textContent = 'Sazka zopakovana.';
    }

    function getNumberColor(number) {
        if (number === 0) return 'green';
        return redNumbers.has(number) ? 'red' : 'black';
    }

    function resultAngle(number) {
        const index = wheelOrder.indexOf(number);
        const sector = index === -1 ? 0 : index;
        return -90 + sector * (360 / wheelOrder.length);
    }

    function setupBetButtons() {
        const numberLeft = 10.05;
        const cellWidth = 6.65;
        const cellHeight = 5.6;
        const rowTops = [59.35, 64.95, 70.55];
        const rowNumbers = [
            [3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36],
            [2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35],
            [1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34]
        ];

        makeButton(
            betHotspots,
            'hotspot',
            { left: 3.1, top: 59.35, width: 6.65, height: 16.8 },
            'Vsadit na 0',
            () => addBet({ type: 'number', value: 0, center: { left: 6.45, top: 67.75 } })
        );

        rowNumbers.forEach((row, rowIndex) => {
            row.forEach((number, colIndex) => {
                const left = numberLeft + colIndex * cellWidth;
                const top = rowTops[rowIndex];

                makeButton(
                    betHotspots,
                    'hotspot',
                    { left, top, width: cellWidth, height: cellHeight },
                    `Vsadit na cislo ${number}`,
                    () => addBet({
                        type: 'number',
                        value: number,
                        center: {
                            left: left + cellWidth / 2,
                            top: top + cellHeight / 2
                        }
                    })
                );
            });
        });

        [
            { value: 'top', top: 59.35, label: 'horni sloupec' },
            { value: 'middle', top: 64.95, label: 'prostredni sloupec' },
            { value: 'bottom', top: 70.55, label: 'spodni sloupec' }
        ].forEach(column => {
            makeButton(
                betHotspots,
                'hotspot',
                { left: 89.85, top: column.top, width: 7.2, height: cellHeight },
                `Vsadit na ${column.label}`,
                () => addBet({
                    type: 'column',
                    value: column.value,
                    center: {
                        left: 93.45,
                        top: column.top + cellHeight / 2
                    }
                })
            );
        });

        [
            { value: 'first', label: '1ST 12', left: 9.75 },
            { value: 'second', label: '2ND 12', left: 36.8 },
            { value: 'third', label: '3RD 12', left: 63.2 }
        ].forEach(dozen => {
            makeButton(
                betHotspots,
                'hotspot',
                { left: dozen.left, top: 76.15, width: 26.95, height: 5.1 },
                `Vsadit na ${dozen.label}`,
                () => addBet({
                    type: 'dozen',
                    value: dozen.value,
                    center: {
                        left: dozen.left + 13.48,
                        top: 78.7
                    }
                })
            );
        });

        [
            { type: 'low', label: '1 TO 18', left: 9.75 },
            { type: 'even', label: 'EVEN', left: 23.25 },
            { type: 'red', label: 'RED', left: 36.8 },
            { type: 'black', label: 'BLACK', left: 50.25 },
            { type: 'odd', label: 'ODD', left: 63.05 },
            { type: 'high', label: '19 TO 36', left: 76.45 }
        ].forEach(outside => {
            makeButton(
                betHotspots,
                'hotspot',
                { left: outside.left, top: 81.25, width: 13.45, height: 5.55 },
                `Vsadit na ${outside.label}`,
                () => addBet({
                    type: outside.type,
                    value: outside.type,
                    center: {
                        left: outside.left + 6.72,
                        top: 84.02
                    }
                })
            );
        });
    }

    function spinRoulette() {
        if (spinning) return;

        if (bets.size === 0) {
            messageBar.textContent = 'Nejdriv polozte chip na stul.';
            return;
        }

        const payloadBets = Array.from(bets.values()).map(bet => ({
            type: bet.type,
            value: bet.value,
            amount: bet.amount
        }));

        spinning = true;
        spinBtn.disabled = true;
        resultValue.classList.remove('show');
        messageBar.textContent = 'Kolo se toci...';

        fetch('/api/spin-roulette/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': CSRF_TOKEN
            },
            body: JSON.stringify({ bets: payloadBets })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                messageBar.textContent = data.error;
                spinning = false;
                spinBtn.disabled = false;
                return;
            }

            const finalAngle = resultAngle(data.number);
            ballAngle += 1800 + finalAngle - (ballAngle % 360);

            ballOrbit.classList.add('spinning');
            ballOrbit.style.setProperty('--ball-angle', `${ballAngle}deg`);

            setTimeout(() => {
                showResult(data);

                lastBets = Array.from(bets.values()).map(bet => ({ ...bet }));
                bets.clear();
                renderBets();

                spinning = false;
                spinBtn.disabled = false;
                ballOrbit.classList.remove('spinning');
            }, 3100);
        })
        .catch(() => {
            messageBar.textContent = 'Spin se nepovedl. Zkuste to znovu.';
            spinning = false;
            spinBtn.disabled = false;
        });
    }

    function showResult(data) {
        const netWin = Number(data.net_win);
        const color = data.color || getNumberColor(data.number);

        balance.textContent = data.new_balance;

        resultValue.innerHTML = `
            <span class="result-number ${color}">${data.number}</span>
            <span>${netWin > 0 ? '+' : ''}$${formatMoney(netWin)}</span>
        `;

        resultValue.classList.add('show');

        if (netWin > 0) {
            messageBar.textContent = `Vyhra $${formatMoney(netWin)}!`;
        } else if (Number(data.total_return) > 0) {
            messageBar.textContent = 'Cast sazky se vratila.';
        } else {
            messageBar.textContent = 'Tentokrat bez vyhry.';
        }
    }

    document.getElementById('clearBtn').addEventListener('click', () => clearBets(true));
    document.getElementById('repeatBtn').addEventListener('click', repeatBets);
    spinBtn.addEventListener('click', spinRoulette);

    setupChipButtons();
    setupBetButtons();
    renderBets();
</script>
{% endblock %}
