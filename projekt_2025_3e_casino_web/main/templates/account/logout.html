{% extends 'main/base.html' %}

{% block title %}Logout - Casino Web{% endblock %}

{% block extra_head %}
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1810 50%, #1a1a1a 100%);
            background-attachment: fixed;
            font-family: 'Georgia', 'Times New Roman', serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: 3px solid #ffd700;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #2d1810 0%, #1a1a1a 100%);
            color: #f4e4bc;
        }
        .card-title {
            color: #f4e4bc;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .card h2 {
            color: #f4e4bc;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        .btn-primary {
            background: linear-gradient(45deg, #daa520, #ffd700);
            border: 2px solid #ffd700;
            color: #8b0000;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #ffd700, #daa520);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #8b0000, #b22222);
            border: 2px solid #ffd700;
            color: #f4e4bc;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, #b22222, #8b0000);
        }
    </style>
{% endblock %}

{% block content %}
    {% load account %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body p-5 text-center">
                        <h1 class="card-title mb-4">Casino Web</h1>
                        <h2 class="mb-4">Are you sure you want to log out?</h2>
                        <form method="post" action="{% url 'account_logout' %}">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-3">
                                <button type="submit" class="btn btn-primary btn-lg">Yes, log out</button>
                                <a href="{% url 'home' %}" class="btn btn-secondary btn-lg">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
